name: Build BandBuilder IELTS APK

on:
  push:
    paths:
      - 'BandBuilder_IELTS_2.0_Source.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        run: |
          test -f BandBuilder_IELTS_2.0_Source.zip
          unzip -tq BandBuilder_IELTS_2.0_Source.zip

      - name: Extract Android project
        run: |
          mkdir -p proj
          unzip -q BandBuilder_IELTS_2.0_Source.zip -d proj
          test -f proj/settings.gradle
          test -f proj/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BandBuilder-IELTS-2.0-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
